version: "3.9"

services:
  mockserver:
    image: mockserver/mockserver:9.1.0@sha256:0ed883c9b2d0ccc90eadecea4d4167eb0b0d67d0a5830a378eb58c45074cd2a6
    container_name: mockserver
    environment:
      MOCKSERVER_SERVER_PORT: 6800
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./Tests/Aria2KitTests/Resources/mockserver/expectations.json:/config/expectations.json
    ports:
      - "6800:6800"
